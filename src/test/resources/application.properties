spring.application.name=purchasing-service-test

spring.datasource.url=jdbc:h2:mem:supplywok;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

authorization.jwt.secret=test-secret-key-with-enough-length-for-context-loading
authorization.jwt.expiration.days=7

supplywok.messaging.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
management.health.rabbit.enabled=false
cors.allowed-origins=http://localhost:4200
