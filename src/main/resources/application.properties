spring.application.name=purchasing-service
spring.profiles.default=dev
server.port=${PORT:8084}
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA:purchasing}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.naming.physical-strategy=aurora.supply_wok.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
authorization.jwt.secret=${JWT_SECRET:local-dev-secret-key-change-me-12345678901234567890}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.tagsSorter=alpha
